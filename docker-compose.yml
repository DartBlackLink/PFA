name: pfa
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecologistica
      POSTGRES_USER: ecologistica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pfa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecologistica -d ecologistica"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://ecologistica:${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}@postgres:5432/ecologistica
      SECRET_KEY: ${SECRET_KEY:?Configura SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ecologistica.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD}
      DRIVER_EMAIL: ${DRIVER_EMAIL:-repartidor@ecologistica.com}
      DRIVER_PASSWORD: ${DRIVER_PASSWORD:?Configura DRIVER_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
volumes:
  pfa_postgres_data:
